controller_manager:
  ros__parameters: # ^注意: 中间两条下划线
    update_rate: 100 # Hz
    use_sim_time: true

    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

fishbot_diff_drive_controller: # 差分驱动
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"] # 注意键名为复数!
    right_wheel_names: ["right_wheel_joint"]

    # 角速度 == 左右轮速度差/轮距
    # 相见参考书 9.3.4 运动学正逆解
    wheel_separation: 0.20
    wheel_radius: 0.032

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    # [修改说明] Jazzy 的 diff_drive_controller 已移除 use_stamped_vel 参数,
    #           控制器强制订阅 geometry_msgs/msg/TwistStamped,
    #           因此通过 launch 中的 twist_stamper 进行 Twist → TwistStamped 转换。
    # use_stamped_vel: false
